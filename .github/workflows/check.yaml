name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Check all supported systems
        run: nix flake check --all-systems --option allow-import-from-derivation false
